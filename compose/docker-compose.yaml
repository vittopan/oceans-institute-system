services:
  server:
    image: cortezaproject/corteza:${VERSION}
    restart: always
    env_file: [ .env ]
    depends_on: [ db ]
    ports:
      - "80:80"
    volumes:
      - ./data/server:/data

  db:
    image: postgres:15
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corteza"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - "dbdata:/var/lib/postgresql/data"
    environment:
      POSTGRES_USER: corteza
      POSTGRES_PASSWORD: corteza
      POSTGRES_DB: corteza

  corredor:
    image: cortezaproject/corteza-server-corredor:latest
    restart: always
    environment:
      - CORREDOR_LOG_LEVEL=info
      - CORREDOR_LISTEN_ADDR=0.0.0.0:80
    volumes:
      - ./data/corredor:/data
      - ./corredor-scripts:/scripts
    depends_on: [ db ]

volumes:
  dbdata:
